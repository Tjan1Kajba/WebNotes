<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { padding-top: 90px; background: #f4f4f4; }
        .register-card { max-width: 460px; margin: 0 auto; padding: 30px; background: #ffa; border-radius: 0 0 0 30px; box-shadow: 0 5px 6px 5px rgba(0, 0, 0, .2); }
        input { margin-bottom: 18px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top" style="background-color: black !important; height: 60px;">
        <a class="navbar-brand" href="/login/">BELEŽKA</a>
    </nav>
    <main class="container">
        <div class="register-card">
            <h2>Registracija</h2>
            <form id="registerForm">
                <label for="username">Uporabniško ime:</label>
                <input class="form-control" type="text" id="username" name="username" required>
                <label for="password">Geslo:</label>
                <input class="form-control" type="password" id="password" name="password" minlength="6" required>
                <button class="btn btn-primary btn-block" type="submit">Registracija</button>
            </form>
            <p class="mt-3 mb-0">Že imaš račun? <a href="/login/">Prijava</a></p>
        </div>
    </main>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const response = await fetch("/register/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            });
            const data = await response.json();
            if (!response.ok) {
                alert(data.detail || "Registracija ni uspela.");
                return;
            }
            alert("Registracija je bila uspešna. Zdaj se lahko prijaviš.");
            window.location.href = "/login/";
        });
    </script>
</body>
</html>
