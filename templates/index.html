<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beležka</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link
      rel="icon"
      href="https://icons.iconarchive.com/icons/wwalczyszyn/android-style/256/Notes-icon.png"
      type="image/x-icon"
    />
    <style>
      body {
        padding-top: 50px !important;
        padding: 15px 15px 90px;
      }

      .container {
        max-width: 800px;
      }

      .site-footer {
        background-color: black;
        padding: 12px 18px 10px;
        box-sizing: border-box;
        min-height: 52px;
        z-index: 50;
        color: white;
        font-size: 16px;
        line-height: 1.4;
      }

      .site-footer-inner {
        position: relative;
        width: 100%;
        line-height: 1.4;
      }

      .site-footer a {
        color: white;
        font-size: 16px;
      }

      .listek {
        width: 100% !important;
        height: 300px !important;
        position: relative;
        background: #ffa;
        overflow: hidden;
        margin: 30px auto;
        padding: 20px;
        border-radius: 0 0 0 30px/45px;
        box-shadow: inset 0 -40px 40px rgba(0, 0, 0, 0.2),
          inset 0 25px 10px rgba(0, 0, 0, 0.2), 0 5px 6px 5px rgba(0, 0, 0, 0.2);
        font-family: "Permanent Marker", cursive;
        line-height: 1.7em;
        font-size: 19px;
        color: black;
        text-decoration: underline;
      }

      .listek li {
        cursor: pointer;
        font-size: 15px;
      }

      .listek:before {
        content: "";
        display: block;
        position: absolute;
        width: 20px;
        height: 25px;
        background: #ffa;
        box-shadow: 3px -2px 10px rgba(0, 0, 0, 0.2),
          inset 15px -15px 15px rgba(0, 0, 0, 0.3);
        left: 0;
        bottom: 0;
        z-index: 2;
        transform: skewX(25deg);
      }

      .listek:after {
        content: "";
        display: block;
        position: absolute;
        width: 75%;
        height: 20px;
        border-top: 3px solid black;
        border-radius: 50%;
        bottom: 0px;
        left: 10%;
      }

      h1 {
        font-size: 25px;
        position: relative;
      }

      .pin-button {
        position: relative;
        width: 38px;
        height: 38px;
        padding: 0;
        border: 2px solid black;
        border-radius: 0.25rem;
        background: #fff;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }

      .note-actions {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9 !important;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pin-button.is-pinned {
        background: #ffd54f;
      }
    </style>
  </head>

  <body>
    {% include "header.html" with context %}

    <script>
      function addNote() {
        fetch("/notes/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ title: "Nov listek", text: "" }),
        })
          .then((response) => {
            if (response.ok) {
              location.reload();
            } else {
              console.error("Error adding note");
            }
          })
          .catch((error) => {
            console.error("Error adding note:", error);
          });
      }
    </script>

    <div class="row">
      {% for note in notes %}
      <div class="col-md-3">
        <div
          class="listek mb-4"
          contenteditable
          data-note-id="{{ note.id }}"
          style="position: relative"
        >
          <div class="note-actions">
            <button
              type="button"
              class="btn btn-warning"
              contenteditable="false"
              style="border: 2px solid black;"
              onclick="publishNote('{{ note.id }}')"
            >
              {% if note.is_public %}Javno{% else %}Objavi{% endif %}
            </button>
            <button
              type="button"
              class="pin-button {% if note.is_pinned %}is-pinned{% endif %}"
              contenteditable="false"
              aria-label="{% if note.is_pinned %}Odpni beležko{% else %}Pripni beležko{% endif %}"
              title="{% if note.is_pinned %}Odpni beležko{% else %}Pripni beležko{% endif %}"
              onclick="togglePin('{{ note.id }}', this)"
            >📌</button>
          </div>
          <button
            type="button"
            class="btn btn-danger"
            contenteditable="false"
            style="
              position: absolute;
              top: 70px;
              right: 20px;
              z-index: 9 !important;
              border: 2px solid black;
            "
            onclick="deleteNote('{{ note.id }}')"
          >
            Zbriši 🗑️
          </button>
          <h1>{{ note.title }}</h1>
          <ul>
            {% for line in note.text.split('\n') %}
            <li>{{ line }}</li>
            {% endfor %}
          </ul>

          <form id="deleteForm_{{ note.id }}"></form>

          <script>
            function publishNote(noteId) {
              fetch(`/notes/${noteId}/publish`, {
                method: "POST",
              })
                .then((response) => response.json())
                .then((data) => {
                  if (data && data.published) {
                    location.reload();
                  } else {
                    console.error("Error publishing note");
                  }
                })
                .catch((error) => {
                  console.error("Error publishing note:", error);
                });
            }

            function togglePin(noteId, button) {
              fetch(`/notes/${noteId}/pin`, { method: "POST" })
                .then((response) => response.json())
                .then((data) => {
                  if (data && typeof data.pinned === "boolean") {
                    location.reload();
                  } else {
                    console.error("Error changing pin state");
                  }
                })
                .catch((error) => {
                  console.error("Error changing pin state:", error);
                });
            }

            function deleteNote(noteId) {
              if (
                confirm("Ali ste prepričani, da želite izbrisati to beležko?")
              ) {
                fetch(`/delnotes/${noteId}`, {
                  method: "DELETE",
                })
                  .then((response) => {
                    if (!response.ok) {
                      console.error("Error deleting note");
                    } else {
                      const noteElement = document.querySelector(
                        `[data-note-id="${noteId}"]`
                      );
                      if (noteElement) {
                        noteElement.remove();
                      }
                    }
                  })
                  .catch((error) => {
                    console.error("Error deleting note:", error);
                  });
              }
            }
          </script>
        </div>
      </div>
      {% endfor %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
      const notes = document.querySelectorAll(".listek");

      notes.forEach((note) => {
        note.addEventListener("blur", () => {
          const noteId = note.dataset.noteId;
          const newTitle = note.querySelector("h1").textContent;
          let newText = "";
          note.querySelectorAll("ul li").forEach((li) => {
            newText += li.textContent + "\n";
          });

          fetch(`/notes/${noteId}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              title: newTitle,
              text: newText,
            }),
          }).then((response) => {
            if (!response.ok) {
              console.error("Error updating note");
            }
          });
        });
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var listeks = document.querySelectorAll(".listek");
        var colors = generateRandomColors(listeks.length);

        listeks.forEach(function (listek, index) {
          listek.style.backgroundColor = colors[index];
        });
      });

      function generateRandomColors(count) {
        var colors = [];
        for (var i = 0; i < count; i++) {
          var color = "#" + Math.floor(Math.random() * 16777215).toString(16);
          colors.push(color);
        }
        return colors;
      }
    </script>
    <br /><br />
    <footer class="fixed-bottom site-footer">
      <div class="site-footer-inner">
        <div style="text-align: center;">Beležka - Kajba</div>
        <div style="position: absolute; right: 0; top: 0; white-space: nowrap;">
          Dobrodošli, <b>{{ username or 'Gost' }}</b>
          <a style="text-decoration: underline; margin-left: 5px;" href="/logout/">Odjava</a>
        </div>
      </div>
    </footer>
  </body>
</html>
